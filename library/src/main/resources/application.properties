# ----------------------------------------------------------------------
# Digital Library Management System - application configuration
# ----------------------------------------------------------------------

spring.application.name=digital-library-management-system

# --- SQLite database (a single local file, no server required) ---
# The file "library.db" is created automatically in the project's working
# directory the first time you run the app.
spring.datasource.url=jdbc:sqlite:library.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Automatically create/update tables from the @Entity classes on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Server ---
server.port=8080

# ----------------------------------------------------------------------
# NOTE ON MYSQL:
# The task allows "MySQL or SQLite". If you'd rather use MySQL instead
# (e.g. you already have it installed / your evaluator expects it),
# comment out the 3 lines above and use this block instead:
#
# spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#
# and add this dependency to pom.xml instead of the sqlite-jdbc one:
# <dependency>
#     <groupId>com.mysql</groupId>
#     <artifactId>mysql-connector-j</artifactId>
#     <scope>runtime</scope>
# </dependency>
# ----------------------------------------------------------------------
