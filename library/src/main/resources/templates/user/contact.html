<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - Digital Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <a class="brand" th:href="@{/user/dashboard}">&#128218; Digital Library</a>
    <nav>
        <a th:href="@{/user/dashboard}">Dashboard</a>
        <a th:href="@{/user/catalogue}">Catalogue</a>
        <a th:href="@{/user/mybooks}">My Books</a>
        <a th:href="@{/user/reservations}">My Reservations</a>
        <a th:href="@{/user/contact}">Contact Us</a>
        <a th:href="@{/logout}">Logout</a>
    </nav>
</div>

<div class="page">
    <h1>Contact / Query</h1>
    <p class="muted">Have a question for the library staff? Send it here.</p>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <div class="card" style="max-width: 520px;">
        <form method="post" th:action="@{/user/contact}">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
    </div>
</div>
</body>
</html>
