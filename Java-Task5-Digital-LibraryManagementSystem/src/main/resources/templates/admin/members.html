<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Members - Digital Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <a class="brand" th:href="@{/admin/dashboard}">&#128218; Digital Library &middot; Admin</a>
    <nav>
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/books}">Books</a>
        <a th:href="@{/admin/issued}">Issued Books</a>
        <a th:href="@{/admin/members}">Members</a>
        <a th:href="@{/admin/fines}">Fines</a>
        <a th:href="@{/admin/contacts}">Contact Messages</a>
        <a th:href="@{/logout}">Logout</a>
    </nav>
</div>

<div class="page">
    <h1>Registered Members</h1>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Full Name</th>
                <th>Username</th>
                <th>Email</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="member : ${members}">
                <td th:text="${member.fullName}"></td>
                <td th:text="${member.username}"></td>
                <td th:text="${member.email}"></td>
            </tr>
            </tbody>
        </table>
        <p class="empty-state" th:if="${#lists.isEmpty(members)}">No members have registered yet.</p>
    </div>
</div>
</body>
</html>
